[package]
name = "my-web-asm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.106"
web-sys = { version = "0.3.83", features = [
    "Window",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "CustomEvent",
    "console",
    "KeyboardEvent",
    "CustomEventInit"
]}
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
